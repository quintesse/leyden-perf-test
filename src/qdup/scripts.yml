scripts:
  upload_code:
  - sh: echo "Uploading test framework to ${HOSTNAME}..."
  - upload: ${{TEST_DIR}}/profiles/ ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/src/ ${{TEST_HOME}}/
  - upload: ${{TEST_ROOT_DIR}}/ ${{TEST_HOME}}/tests/
  - upload: ${{TEST_DIR}}/hardware-tweaks.conf ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/local-settings.xml ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/jbang ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/run ${{TEST_HOME}}/

  apply_hw_tweaks:
  - sh: |
      if [[ "${{ENABLE_HW_TWEAKS:-false}}" == "true" ]]; then
        echo "Applying hardware tweaks on ${HOSTNAME}..."
        source ${{TEST_HOME}}/hardware-tweaks.conf
        source ${{TEST_HOME}}/src/scripts/hwtweakfuncs.sh
        if check_hwtweak_requirements && detect_cpu_info; then
          apply_hardware_tweaks
        else
          echo "Warning: Hardware tweaks requirements not met, skipping..."
        fi
      fi

  restore_hw_tweaks:
  - sh: |
      if [[ "${{ENABLE_HW_TWEAKS:-false}}" == "true" ]]; then
        echo "Restoring hardware settings on ${HOSTNAME}..."
        source ${{TEST_HOME}}/hardware-tweaks.conf
        source ${{TEST_HOME}}/src/scripts/hwtweakfuncs.sh
        if detect_cpu_info; then
          restore_hardware_tweaks
        else
          echo "Warning: Could not restore hardware settings"
        fi
      fi

  setup_infra:
  - sh: export JBANG_DEFAULT_JAVA_VERSION=25
  - sh: mkdir -p ${{CACHE_DIR}}
  - sh: export TEST_CACHE_DIR=${{CACHE_DIR}}
  - sh: echo ${HOSTNAME}
    then:
    - set-state: RUN.INFRA_HOST
  - sh: ${{RUN_CMD}} infra -o ${{TEST_OUT}} ${{TEST}} setup

  run_infra:
  - sh: echo "Starting infrastructure on ${HOSTNAME}"
  - sh: export TEST_CACHE_DIR=${{CACHE_DIR}}
  - sh: ${{RUN_CMD}} infra -o ${{TEST_OUT}} ${{TEST}} start
  - signal: INFRA_READY
  - wait-for: TEST_END
  - script: stop_infra
  - queue-download: ${{TEST_OUT}}/

  stop_infra:
  - sh: echo "Stopping infrastructure on ${HOSTNAME}"
  - sh: export TEST_CACHE_DIR=${{CACHE_DIR}}
  - sh: ${{RUN_CMD}} infra -o ${{TEST_OUT}} ${{TEST}} stop

  setup_app:
  - sh: export JBANG_DEFAULT_JAVA_VERSION=25
  - sh: mkdir -p ${{CACHE_DIR}}
  - sh: export TEST_CACHE_DIR=${{CACHE_DIR}}
  - sh: echo ${HOSTNAME}
    then:
    - set-state: RUN.APP_HOST
  - sh: ${{RUN_CMD}} app -o ${{TEST_OUT}} -j ${{JAVA_VERSION}} ${{TEST}} setup
    
  run_app:
  - sh: echo "Application waiting for infrastructure on ${HOSTNAME}"
  - wait-for: INFRA_READY
  - sh: export TEST_INFRA_HOST=${{INFRA_HOST}}
  - sh: export TEST_CACHE_DIR=${{CACHE_DIR}}
  - sh: echo "Starting application on ${HOSTNAME}"
  - sh: ${{RUN_CMD}} app -o ${{TEST_OUT}} -j ${{JAVA_VERSION}} ${{TEST}} start
  - signal: APP_READY
  - wait-for: TEST_END
  - script: stop_app
  - queue-download: ${{TEST_OUT}}/

  stop_app:
  - sh: echo "Stopping application on ${HOSTNAME}"
  - sh: export TEST_CACHE_DIR=${{CACHE_DIR}}
  - sh: ${{RUN_CMD}} app -o ${{TEST_OUT}} -j ${{JAVA_VERSION}} ${{TEST}} stop

  setup_driver:
  - sh: export JBANG_DEFAULT_JAVA_VERSION=25
  - sh: mkdir -p ${{CACHE_DIR}}
  - sh: export TEST_CACHE_DIR=${{CACHE_DIR}}
  - sh: echo ${HOSTNAME}
    then:
    - set-state: RUN.DRIVER_HOST
  - sh: ${{RUN_CMD}} drive -o ${{TEST_OUT}} -d ${{TEST_DRIVER}} ${{TEST}} setup
    
  run_driver:
  - sh: export TEST_INFRA_HOST=${{INFRA_HOST}}
  - sh: export TEST_APP_HOST=${{APP_HOST}}
  - sh: export TEST_CACHE_DIR=${{CACHE_DIR}}
  - sh: echo "Preparing driver on ${HOSTNAME}"
  - sh: ${{RUN_CMD}} drive -o ${{TEST_OUT}} -d ${{TEST_DRIVER}} ${{TEST}} prime
  - sh: echo "Driver waiting for application on ${HOSTNAME}"
  - wait-for: APP_READY
  - sh: echo "Running tests on ${HOSTNAME} ..."
  - sh: ${{RUN_CMD}} drive -o ${{TEST_OUT}} -d ${{TEST_DRIVER}} ${{TEST}} run
  - signal: TEST_END
  - queue-download: ${{TEST_OUT}}/
