scripts:
  upload_code:
  - sh: echo "Uploading test framework to ${HOSTNAME}..."
  - upload: ${{TEST_DIR}}/profiles/ ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/src/ ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/tests/ ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/hwtweaked-run ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/hardware-tweaks.conf ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/local-settings.xml ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/jbang ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/run ${{TEST_HOME}}/

  apply_hw_tweaks:
  - sh: |
      if [[ "${{ENABLE_HW_TWEAKS:-false}}" == "true" ]]; then
        echo "Applying hardware tweaks on ${HOSTNAME}..."
        source ${{TEST_HOME}}/hardware-tweaks.conf
        source ${{TEST_HOME}}/src/scripts/hwtweakfuncs.sh
        if check_hwtweak_requirements && detect_cpu_info; then
          apply_hardware_tweaks
        else
          echo "Warning: Hardware tweaks requirements not met, skipping..."
        fi
      fi

  restore_hw_tweaks:
  - sh: |
      if [[ "${{ENABLE_HW_TWEAKS:-false}}" == "true" ]]; then
        echo "Restoring hardware settings on ${HOSTNAME}..."
        source ${{TEST_HOME}}/hardware-tweaks.conf
        source ${{TEST_HOME}}/src/scripts/hwtweakfuncs.sh
        if detect_cpu_info; then
          restore_hardware_tweaks
        else
          echo "Warning: Could not restore hardware settings"
        fi
      fi

  setup_infra:
    - sh: export JBANG_DEFAULT_JAVA_VERSION=25
    - sh: echo ${HOSTNAME}
      then:
        - set-state: RUN.INFRA_HOST
    - sh: ${{INFRA_RUN_CMD}} infra -o ${{INFRA_TEST_OUT}} -P "${{PROFILES}}" ${{TEST}} setup

  run_infra:
    - sh: echo "Starting infrastructure on ${HOSTNAME}"
    - sh: ${{INFRA_RUN_CMD}} infra -o ${{INFRA_TEST_OUT}}${{RUN_TAG}} -P "${{PROFILES}}" ${{TEST}} start
    - signal: INFRA_READY
    - wait-for: TEST_END
    - set-signal: INFRA_READY 0
    - script: stop_infra
    - queue-download: ${{INFRA_TEST_OUT}}${{RUN_TAG}}/

  stop_infra:
    - sh: echo "Stopping infrastructure on ${HOSTNAME}"
    - sh: ${{INFRA_RUN_CMD}} infra -o ${{INFRA_TEST_OUT}}${{RUN_TAG}} -P "${{PROFILES}}" ${{TEST}} stop

  dummy_infra:
    - signal: INFRA_READY
    - wait-for: TEST_END

  setup_app:
    - sh: export JBANG_DEFAULT_JAVA_VERSION=25
    - sh: echo ${HOSTNAME}
      then:
        - set-state: RUN.APP_HOST
    - sh: ${{APP_RUN_CMD}} app -o ${{APP_TEST_OUT}} -j ${{JAVA_VERSION}} -P "${{PROFILES}}" ${{TEST}} setup

  run_app:
    - sh: echo "Application waiting for infrastructure on ${HOSTNAME}"
    - set-signal: TEST_END 0
    - wait-for: INFRA_READY
    - sh: export TEST_INFRA_HOST=${{INFRA_HOST}}
    - sh: echo "Starting application on ${HOSTNAME}"
    - sh: ${{APP_RUN_CMD}} app -o ${{APP_TEST_OUT}}${{RUN_TAG}} -j ${{JAVA_VERSION}} -P "${{PROFILES}}" ${{TEST}} start
    - signal: APP_READY
    - wait-for: TEST_END
    - set-signal: APP_READY 0
    - script: stop_app
    - queue-download: ${{APP_TEST_OUT}}${{RUN_TAG}}/

  stop_app:
    - sh: echo "Stopping application on ${HOSTNAME}"
    - sh: ${{APP_RUN_CMD}} app -o ${{APP_TEST_OUT}}${{RUN_TAG}} -j ${{JAVA_VERSION}} -P "${{PROFILES}}" ${{TEST}} stop

  setup_driver:
    - sh: export JBANG_DEFAULT_JAVA_VERSION=25
    - sh: echo ${HOSTNAME}
      then:
        - set-state: RUN.DRIVER_HOST
    - sh: ${{DRIVER_RUN_CMD}} drive -o ${{DRIVER_TEST_OUT}} -d ${{TEST_DRIVER}} -P "${{PROFILES}}" ${{TEST}} setup

  run_driver:
    - sh: export TEST_INFRA_HOST=${{INFRA_HOST}}
    - sh: export TEST_APP_HOST=${{APP_HOST}}
    - sh: echo "Preparing driver on ${HOSTNAME}"
    - sh: ${{DRIVER_RUN_CMD}} drive -o ${{DRIVER_TEST_OUT}}${{RUN_TAG}} -d ${{TEST_DRIVER}} -P "${{PROFILES}}" ${{TEST}} prime
    - sh: echo "Driver waiting for application on ${HOSTNAME}"
    - wait-for: APP_READY
    - sh: echo "Running tests on ${HOSTNAME} ..."
    - sh: ${{DRIVER_RUN_CMD}} drive -o ${{DRIVER_TEST_OUT}}${{RUN_TAG}} -d ${{TEST_DRIVER}} -P "${{PROFILES}}" ${{TEST}} run
    - signal: TEST_END
    - queue-download: ${{DRIVER_TEST_OUT}}${{RUN_TAG}}/

states:
  ROOT_DIR: ${{ENV.SCRIPT_DIR}}/../..
  WORK_DIR: /tmp/leyden-perf-test
  TEST_HOME_BASE: ${{WORK_DIR}}/arena
  INFRA_RUN_CMD: ${{TEST_HOME_BASE}}/infra/run
  APP_RUN_CMD: ${{TEST_HOME_BASE}}/app/run
  DRIVER_RUN_CMD: ${{TEST_HOME_BASE}}/driver/run
  TEST_OUT_BASE: ${{WORK_DIR}}/results
  INFRA_TEST_OUT: ${{TEST_OUT_BASE}}
  APP_TEST_OUT: ${{TEST_OUT_BASE}}
  DRIVER_TEST_OUT: ${{TEST_OUT_BASE}}
  TEST: _set_outside_
  JAVA_VERSION: 25
  TEST_DRIVER: oha
  RUN_TAG: ""
  PROFILES: ""
  