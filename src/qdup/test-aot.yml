name: qdup-aot-strategy

roles:
  infra:
    hosts:
      - infrahost
    setup-scripts:
      - upload_code:
        with:
          TEST_HOME: ${{INFRA_TEST_HOME}}
      - setup_infra:

    run-scripts:
      - run_aot_infra:

    cleanup-scripts:
      - stop_infra:
        with:
          RUN_TAG: "aot"

  app:
    hosts:
      - apphost
    setup-scripts:
      - upload_code:
        with:
          TEST_HOME: ${{APP_TEST_HOME}}
      - setup_app:

    run-scripts:
      - run_aot_app:

    cleanup-scripts:
      - stop_app:
        with:
          RUN_TAG: "aot"
      - restore_hw_tweaks:
        with:
          TEST_HOME: ${{APP_TEST_HOME}}

  driver:
    hosts:
      - driverhost
    setup-scripts:
      - upload_code:
        with:
          TEST_HOME: ${{DRIVER_TEST_HOME}}
      - setup_driver:

    run-scripts:
      - run_aot_driver:

    cleanup-scripts:
      - restore_hw_tweaks:
        with:
          TEST_HOME: ${{DRIVER_TEST_HOME}}

# Entries in run-scripts execute concurrently. Use one sequential script per
# role, with a barrier after all training work (including app/infra shutdown).
# Each pass has separate readiness/end signals so training cannot release AOT.
scripts:
  run_aot_infra:
    - script: run_infra
      with:
        RUN_TAG: "training"
        RUN_SIGNAL_PREFIX: "TRAINING_"
    - signal: TRAINING_INFRA_DONE
    - wait-for: TRAINING_APP_DONE
    - wait-for: TRAINING_DRIVER_DONE
    - script: run_infra
      with:
        RUN_TAG: "aot"
        RUN_SIGNAL_PREFIX: "AOT_"

  run_aot_app:
    - script: apply_hw_tweaks
      with:
        TEST_HOME: ${{APP_TEST_HOME}}
    - script: run_app
      with:
        RUN_TAG: "training"
        RUN_SIGNAL_PREFIX: "TRAINING_"
    - signal: TRAINING_APP_DONE
    - wait-for: TRAINING_INFRA_DONE
    - wait-for: TRAINING_DRIVER_DONE
    - script: run_app
      with:
        RUN_TAG: "aot"
        RUN_SIGNAL_PREFIX: "AOT_"

  run_aot_driver:
    - script: apply_hw_tweaks
      with:
        TEST_HOME: ${{DRIVER_TEST_HOME}}
    - script: run_driver
      with:
        RUN_TAG: "training"
        RUN_SIGNAL_PREFIX: "TRAINING_"
    - signal: TRAINING_DRIVER_DONE
    - wait-for: TRAINING_INFRA_DONE
    - wait-for: TRAINING_APP_DONE
    - script: run_driver
      with:
        RUN_TAG: "aot"
        RUN_SIGNAL_PREFIX: "AOT_"
