name: qdup-aot-strategy

roles:
  infra:
    hosts:
      - infrahost
    setup-scripts:
      - upload_code:
        with:
          TEST_HOME: ${{INFRA_TEST_HOME}}
      - setup_infra:

    run-scripts:
      # FIRST COMPLETE CYCLE (for AOT training)
      - run_infra:
        with:
          RUN_TAG: "training"

      # SECOND COMPLETE CYCLE (for actual test run)
      - run_infra:
        with:
          RUN_TAG: "aot"

    cleanup-scripts:
      - stop_infra:
        with:
          RUN_TAG: "aot"

  app:
    hosts:
      - apphost
    setup-scripts:
      - upload_code:
        with:
          TEST_HOME: ${{APP_TEST_HOME}}
      - setup_app:

    run-scripts:
      - apply_hw_tweaks:
        with:
          TEST_HOME: ${{APP_TEST_HOME}}

      # FIRST COMPLETE CYCLE (for AOT training)
      - run_app:
        with:
          RUN_TAG: "training"

      # SECOND COMPLETE CYCLE (for actual test run)
      - run_app:
        with:
          RUN_TAG: "aot"

    cleanup-scripts:
      - stop_app:
        with:
          RUN_TAG: "aot"
      - restore_hw_tweaks:
        with:
          TEST_HOME: ${{APP_TEST_HOME}}

  driver:
    hosts:
      - driverhost
    setup-scripts:
      - upload_code:
        with:
          TEST_HOME: ${{DRIVER_TEST_HOME}}
      - setup_driver:

    run-scripts:
      - apply_hw_tweaks:
        with:
          TEST_HOME: ${{DRIVER_TEST_HOME}}

      # FIRST COMPLETE CYCLE (for AOT training)
      - run_driver:
        with:
          RUN_TAG: "training"

      # SECOND COMPLETE CYCLE (for actual test run)
      - run_driver:
        with:
          RUN_TAG: "aot"

    cleanup-scripts:
      - restore_hw_tweaks:
        with:
          TEST_HOME: ${{DRIVER_TEST_HOME}}
