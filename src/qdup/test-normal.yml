name: qdup-normal-strategy

roles:
  infra:
    hosts:
      - infrahost
    setup-scripts:
      - upload_code:
        with:
          TEST_HOME: ${{TEST_HOME_BASE}}/infra
      - setup_infra:

    run-scripts:
      - run_infra:

    cleanup-scripts:
      - stop_infra:

  app:
    hosts:
      - apphost
    setup-scripts:
      - upload_code:
        with:
          TEST_HOME: ${{TEST_HOME_BASE}}/app
      - setup_app:

    run-scripts:
    - apply_hw_tweaks:
      with:
        TEST_HOME: ${{TEST_HOME_BASE}}/app
    - run_app:
      with:
        RUN_CMD: ${{TEST_HOME_BASE}}/app/run
        TEST_OUT: ${{TEST_OUT_BASE}}
    - restore_hw_tweaks:
      with:
        TEST_HOME: ${{TEST_HOME_BASE}}/app
    cleanup-scripts:
    - restore_hw_tweaks:
      with:
        TEST_HOME: ${{TEST_HOME_BASE}}/app
    - stop_app:
      with:
        RUN_CMD: ${{TEST_HOME_BASE}}/app/run
        TEST_OUT: ${{TEST_OUT_BASE}}
  driver:
    hosts:
      - driverhost
    setup-scripts:
      - upload_code:
        with:
          TEST_HOME: ${{TEST_HOME_BASE}}/driver
      - setup_driver:

    run-scripts:
      - run_driver:
