name: qdup-normal-strategy

roles:
  infra:
    hosts:
      - infrahost
    setup-scripts:
      - upload_code:
        with:
          TEST_HOME: ${{INFRA_TEST_HOME}}
      - setup_infra:

    run-scripts:
      - run_infra:

    cleanup-scripts:
      - stop_infra:

  app:
    hosts:
      - apphost
    setup-scripts:
      - upload_code:
        with:
          TEST_HOME: ${{APP_TEST_HOME}}
      - setup_app:

    run-scripts:
      - apply_hw_tweaks:
        with:
          TEST_HOME: ${{APP_TEST_HOME}}
      - run_app:

    cleanup-scripts:
      - stop_app:
      - restore_hw_tweaks:
        with:
          TEST_HOME: ${{APP_TEST_HOME}}

  driver:
    hosts:
      - driverhost
    setup-scripts:
      - upload_code:
        with:
          TEST_HOME: ${{DRIVER_TEST_HOME}}
      - setup_driver:

states:
  TEST_DIR: ${{ENV.SCRIPT_DIR}}/../..
  TEMP_DIR: /tmp/leyden-perf-test
  RESULTS_DIR: _set_outside_
  CACHE_DIR: _set_outside_
  TEST_HOME_BASE: ${{TEMP_DIR}}/arena
  TEST_OUT_BASE: ${{RESULTS_DIR}}
  TEST: _set_outside_
  JAVA_VERSION: 25
  TEST_DRIVER: oha
