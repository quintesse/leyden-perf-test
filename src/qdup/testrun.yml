name: leyden-perf-test-qdup

scripts:
  upload_code:
  - sh: echo "Uploading test framework to ${HOSTNAME}..."
  - upload: ${{TEST_DIR}}/src/ ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/profiles/ ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/hwtweaked-run ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/hardware-tweaks.conf ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/local-settings.xml ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/jbang ${{TEST_HOME}}/
  - upload: ${{TEST_DIR}}/run ${{TEST_HOME}}/
  
  init_infra:
  - set-state:
      key: HOST.TEST_HOME
      value: ~/leyden-perf-test
      #value: ~/leyden-perf-test/infra
  
  setup_infra:
  - sh: export JBANG_DEFAULT_JAVA_VERSION=25
  - sh: echo ${HOSTNAME}
    then:
    - set-state: RUN.INFRA_HOST
  - sh: ${{RUN_CMD}} infra ${{TEST}} setup

  run_infra:
  - sh: echo "Starting infrastructure on ${HOSTNAME}"
  - sh: ${{RUN_CMD}} infra ${{TEST}} start
  - signal: INFRA_READY
  - wait-for: TEST_END

  stop_infra:
  - sh: echo "Stopping infrastructure on ${HOSTNAME}"
  - sh: ${{RUN_CMD}} infra ${{TEST}} stop

  init_app:
  - set-state:
      key: HOST.TEST_HOME
      value: ~/leyden-perf-test
      #value: ~/leyden-perf-test/app
  
  setup_app:
  - sh: export JBANG_DEFAULT_JAVA_VERSION=25
  - sh: echo ${HOSTNAME}
    then:
    - set-state: RUN.APP_HOST
  - sh: ${{RUN_CMD}} app -j ${{JAVA_VERSION}} ${{TEST}} setup
    
  run_app:
  - sh: echo "Application waiting for infrastructure on ${HOSTNAME}"
  - wait-for: INFRA_READY
  - sh: export TEST_INFRA_HOST=${{INFRA_HOST}}
  - sh: echo "Starting application on ${HOSTNAME}"
  - sh: ${{RUN_CMD}} app -j ${{JAVA_VERSION}} ${{TEST}} start
  - signal: APP_READY
  - wait-for: TEST_END

  stop_app:
  - sh: echo "Stopping application on ${HOSTNAME}"
  - sh: ${{RUN_CMD}} app -j ${{JAVA_VERSION}} ${{TEST}} stop

  init_driver:
  - set-state:
      key: HOST.TEST_HOME
      value: ~/leyden-perf-test
      #value: ~/leyden-perf-test/driver
  
  setup_driver:
  - sh: export JBANG_DEFAULT_JAVA_VERSION=25
  - sh: echo ${HOSTNAME}
    then:
    - set-state: RUN.DRIVER_HOST
  - sh: ${{RUN_CMD}} drive -d ${{TEST_DRIVER}} ${{TEST}} setup
    
  run_driver:
  - sh: export TEST_INFRA_HOST=${{INFRA_HOST}}
  - sh: export TEST_APP_HOST=${{APP_HOST}}
  - sh: echo "Preparing driver on ${HOSTNAME}"
  - sh: ${{RUN_CMD}} drive -d ${{TEST_DRIVER}} ${{TEST}} prepare
  - sh: echo "Driver waiting for application on ${HOSTNAME}"
  - wait-for: APP_READY
  - sh: echo "Running tests on ${HOSTNAME} ..."
  - sh: ${{RUN_CMD}} drive -d ${{TEST_DRIVER}} ${{TEST}} run
  - signal: TEST_END

  collate_results:
  - sh: echo "Collating results on ${HOSTNAME}"

hosts:
  infrahost:
    local: true
    platform: podman
    container: quay.io/fedora/fedora
    create-container: podman run -ti --name infrahost --hostname infrahost --network leyden-perf-test-net --cidfile ${{cidfile}} --env PS1="${{QDUP_PROMPT}}" ${{image}}
    #create-connected-container: podman run -ti --name infrahost --hostname infrahost --network leyden-perf-test-net --cidfile ${{cidfile}} --env PS1="${{QDUP_PROMPT}}" ${{image}} /bin/bash
  apphost:
    local: true
    platform: podman
    container: quay.io/fedora/fedora
    create-container: podman run -ti --name apphost --hostname apphost --network leyden-perf-test-net --cidfile ${{cidfile}} --env PS1="${{QDUP_PROMPT}}" -p 8080:8080 ${{image}}
    #create-connected-container: podman run -ti --name apphost --hostname apphost --network leyden-perf-test-net --cidfile ${{cidfile}} --env PS1="${{QDUP_PROMPT}}" -p 8080:8080 ${{image}} /bin/bash
  driverhost:
    local: true
    platform: podman
    container: quay.io/fedora/fedora
    create-container: podman run -ti --name driverhost --hostname driverhost --network leyden-perf-test-net --cidfile ${{cidfile}} --env PS1="${{QDUP_PROMPT}}" ${{image}}
    #create-connected-container: podman run -ti --name driverhost --hostname driverhost --network leyden-perf-test-net --cidfile ${{cidfile}} --env PS1="${{QDUP_PROMPT}}" ${{image}} /bin/bash

roles:
  infra:
    hosts:
    - infrahost
    setup-scripts:
    - init_infra
    - upload_code
    - setup_infra
    run-scripts:
    - run_infra
    cleanup-scripts:
    - stop_infra
  app:
    hosts:
    - apphost
    setup-scripts:
    - init_app
    - upload_code
    - setup_app
    run-scripts:
    - run_app
    cleanup-scripts:
    - stop_app
  driver:
    hosts:
    - driverhost
    setup-scripts:
    - init_driver
    - upload_code
    - setup_driver
    run-scripts:
    - run_driver

states:
  TEST_DIR: ${{ENV.SCRIPT_DIR}}/../..
  RUN_CMD: ${{TEST_HOME}}/run
  TEST: _set_outside_
  JAVA_VERSION: 25
  TEST_DRIVER: oha
